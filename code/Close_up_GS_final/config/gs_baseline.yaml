# Close-up-GS Baseline Configuration
# GSModel configuration for 30K iterations training from training views Vs

# Model parameters (GSModel specific)
model:
  max_gaussians: 100000
  sh_degree: 3
  densify_threshold: 0.3333333333333333  # 1/3 as specified in paper section 4.3.4

# Training parameters for 30K iterations (Paper section 5.2)
training:
  max_iterations: 30000  # Paper requirement: optimize from training views Vs for 30K iterations
  learning_rates:
    position: 0.00016
    position_final: 0.0000016
    feature: 0.0025
    opacity: 0.05
    scaling: 0.005
    rotation: 0.001
  
  # Densification schedule
  densify_from_iter: 500
  densify_until_iter: 15000
  densification_interval: 100
  opacity_reset_interval: 3000
  
  # Gradient thresholds
  densify_grad_threshold: 0.0002
  min_opacity: 0.005

# Loss function parameters (Equation 4)
loss:
  lambda_ssim: 0.2  # λ parameter in L1 + λ SSIM

# Data parameters
data:
  target_resolution: [512, 512]  # Avoid channel mismatch
  data_device: 'cuda'
  
# Logging parameters
logging:
  use_tensorboard: true
  use_wandb: false
  log_interval: 100
  save_interval: 5000

# Output parameters
output:
  output_dir: './outputs/gs_baseline'
  render_test_images: true
  num_test_images: 10

# Close-up specific parameters (for baseline, these are disabled)
closeup:
  detail_enhancement: false
  adaptive_density: false
  super_resolution: false
  
# GPU settings
device:
  use_cuda: true
  gpu_id: 0

# Optimization settings
optimization:
  use_amp: false  # Automatic Mixed Precision
  gradient_clip: 1.0
  
# Evaluation settings
evaluation:
  eval_interval: 2000
  metrics: ['psnr', 'ssim', 'lpips']
